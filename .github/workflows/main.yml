name: Blutter Analysis
on: [push, workflow_dispatch]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Blutter
        run: |
          git clone https://github.com/worawit/blutter
          cd blutter
          pip install -r requirements.txt
          
      - name: Run Blutter
        run: |
          cd blutter
          python blutter.py ../libapp.so ../output
          
      - name: Upload Output
        uses: actions/upload-artifact@v4
        with:
          name: blutter-output
          path: output/
