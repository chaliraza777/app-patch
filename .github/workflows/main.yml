name: Blutter Analysis
on: [push, workflow_dispatch]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          pip install capstone requests
          
      - name: Install Blutter
        run: |
          git clone https://github.com/worawit/blutter
          cd blutter
          pip install capstone
          
      - name: Run Blutter
        run: |
          cd blutter
          python3 blutter.py /home/runner/work/app-patch/app-patch/libapp.so ../output
